# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

silent: true

tasks:
  build:
    desc: Builds the extension
    cmd: web-ext build -s src/ -a out/ -o

  validate:
    desc: Validates the extension
    cmd: web-ext lint -s src/

  generate:
    desc: Generates the userscript
    cmd: bash scripts/gen-script.sh
